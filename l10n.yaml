# Configuration de la génération de localisations Flutter.
# Les fichiers ARB se trouvent dans lib/l10n/.
# Le template de référence est app_fr.arb (langue d'origine du projet) ;
# les autres locales se calquent dessus.
arb-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false

# Le code généré est écrit en clair dans `lib/l10n/generated/` et importé via
# `package:lightcutoff_app/...`. Dossier gitignoré, régénéré à chaque
# `flutter pub get`/build. (`synthetic-package` retiré : sans effet depuis
# Flutter 3.32+, la génération sur disque est le seul mode.)
output-dir: lib/l10n/generated
