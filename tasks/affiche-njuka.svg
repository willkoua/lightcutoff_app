<svg width="680" height="1545" viewBox="0 0 680 1545" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Affiche de présentation de NJUKA</title>
<desc>Affiche grand public : NJUKA, communauté d'entraide pour signaler les coupures de courant. Problème, idée d'entraide, ce que ça change, 4 étapes, coupures annoncées Eneo, plan actuel, souhaits futurs, et contact email.</desc>
<style>
.title{font:700 56px Arial,Helvetica,sans-serif;fill:#F88E01}
.tag{font:400 19px Arial,sans-serif;fill:#FBE9CC}
.lbl{font:700 13px Arial,sans-serif;fill:#C46F00;letter-spacing:2px}
.lblD{font:700 13px Arial,sans-serif;fill:#3A1F02;letter-spacing:2px}
.h{font:700 22px Arial,sans-serif;fill:#1A1A1A}
.p{font:400 17px Arial,sans-serif;fill:#52504B}
.stept{font:700 18px Arial,sans-serif;fill:#1A1A1A}
.steps{font:400 15px Arial,sans-serif;fill:#5A5852}
.num{font:700 20px Arial,sans-serif;fill:#FFFFFF;text-anchor:middle}
.amH{font:700 22px Arial,sans-serif;fill:#2E1801}
.amP{font:400 17px Arial,sans-serif;fill:#5A3304}
.bul{font:400 15px Arial,sans-serif;fill:#2C2C2A}
.fH{font:700 21px Arial,sans-serif;fill:#FFFFFF}
.fS{font:400 14px Arial,sans-serif;fill:#F88E01}
.fE{font:400 14px Arial,sans-serif;fill:#9A958C}
</style>
<rect x="0" y="0" width="680" height="1545" fill="#FFFFFF"/>

<rect x="0" y="0" width="680" height="150" fill="#1A1A1A"/>
<circle cx="618" cy="60" r="21" fill="#F88E01"/>
<rect x="609" y="80" width="18" height="7" rx="2" fill="#FBE9CC"/>
<rect x="612" y="89" width="12" height="5" rx="2" fill="#FBE9CC"/>
<line x1="618" y1="22" x2="618" y2="32" stroke="#F88E01" stroke-width="3" stroke-linecap="round"/>
<line x1="585" y1="60" x2="575" y2="60" stroke="#F88E01" stroke-width="3" stroke-linecap="round"/>
<line x1="651" y1="60" x2="661" y2="60" stroke="#F88E01" stroke-width="3" stroke-linecap="round"/>
<text x="40" y="84" class="title">NJUKA</text>
<text x="43" y="118" class="tag">Ensemble, on y voit plus clair.</text>

<rect x="0" y="150" width="680" height="165" fill="#FFF7EC"/>
<text x="40" y="193" class="lbl">LE PROBLÈME</text>
<text x="40" y="229" class="h">Quand le courant saute, chacun reste dans le noir.</text>
<text x="40" y="262" class="p">Chez moi seulement ? Tout le quartier ? Pour combien de temps ?</text>
<text x="40" y="290" class="p">L'information ne circule pas — chacun subit seul.</text>

<rect x="0" y="315" width="680" height="175" fill="#FCEBD2"/>
<text x="40" y="355" class="lbl">L'IDÉE : S'ENTRAIDER</text>
<text x="40" y="391" class="h">Et si on s'informait les uns les autres ?</text>
<text x="40" y="424" class="p">NJUKA réunit les habitants en une communauté d'entraide</text>
<text x="40" y="452" class="p">autour des coupures : chacun informe, tout le monde y voit clair.</text>

<text x="40" y="528" class="lbl">CE QUE NJUKA CHANGE</text>
<text x="40" y="564" class="h">Vous voyez en temps réel où ça coupe,</text>
<text x="40" y="596" class="p">et vous savez quand le courant revient — grâce à tous.</text>

<rect x="0" y="610" width="680" height="335" fill="#FFF7EC"/>
<text x="40" y="648" class="lbl">COMMENT ÇA MARCHE</text>

<circle cx="62" cy="696" r="21" fill="#F88E01"/>
<text x="62" y="703" class="num">1</text>
<text x="100" y="690" class="stept">Je signale</text>
<text x="100" y="713" class="steps">Un seul appui quand le courant coupe.</text>

<circle cx="62" cy="761" r="21" fill="#F88E01"/>
<text x="62" y="768" class="num">2</text>
<text x="100" y="755" class="stept">Les voisins confirment</text>
<text x="100" y="778" class="steps">« Coupé chez moi aussi » → l'info devient fiable.</text>

<circle cx="62" cy="826" r="21" fill="#F88E01"/>
<text x="62" y="833" class="num">3</text>
<text x="100" y="820" class="stept">Tout le monde voit la carte</text>
<text x="100" y="843" class="steps">Les coupures s'affichent autour de vous.</text>

<circle cx="62" cy="891" r="21" fill="#F88E01"/>
<text x="62" y="898" class="num">4</text>
<text x="100" y="885" class="stept">Le courant revient tout seul</text>
<text x="100" y="908" class="steps">Assez de gens le disent → la coupure se ferme.</text>

<rect x="0" y="945" width="680" height="145" fill="#F88E01"/>
<text x="40" y="983" class="lblD">EN PLUS — LES COUPURES ANNONCÉES</text>
<text x="40" y="1021" class="amH">Les délestages d'Eneo, affichés par quartier.</text>
<text x="40" y="1053" class="amP">Suivez votre quartier et soyez prévenu la veille.</text>

<text x="40" y="1128" class="lbl">AUJOURD'HUI</text>
<circle cx="48" cy="1157" r="3.5" fill="#F88E01"/><text x="64" y="1162" class="bul">En test, avec les premiers utilisateurs</text>
<circle cx="48" cy="1185" r="3.5" fill="#F88E01"/><text x="64" y="1190" class="bul">100% gratuit</text>
<circle cx="48" cy="1213" r="3.5" fill="#F88E01"/><text x="64" y="1218" class="bul">Android · Cameroun (Eneo)</text>

<rect x="0" y="1245" width="680" height="195" fill="#FFF7EC"/>
<text x="40" y="1283" class="lbl">NOTRE SOUHAIT POUR LE FUTUR</text>
<circle cx="48" cy="1312" r="3.5" fill="#F88E01"/><text x="64" y="1317" class="bul">Prédire les coupures à l'avance</text>
<circle cx="48" cy="1340" r="3.5" fill="#F88E01"/><text x="64" y="1345" class="bul">Utilisable dans n'importe quel pays</text>
<circle cx="48" cy="1368" r="3.5" fill="#F88E01"/><text x="64" y="1373" class="bul">Un espace où les habitants échangent, s'entraident et discutent en direct</text>
<circle cx="48" cy="1396" r="3.5" fill="#F88E01"/><text x="64" y="1401" class="bul">Signaler une coupure depuis d'autres plateformes, comme WhatsApp</text>

<rect x="0" y="1440" width="680" height="105" fill="#1A1A1A"/>
<text x="40" y="1480" class="fH">Aidez-nous à faire grandir NJUKA.</text>
<text x="40" y="1507" class="fS">Testez, donnez votre avis — grandissons ensemble.</text>
<text x="40" y="1532" class="fE">Écrivez-nous : <tspan font-weight="700" fill="#F88E01">lightcutoff@gmail.com</tspan></text>
</svg>
